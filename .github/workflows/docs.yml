name: docs

# A reusable workflow: builds a project's ombryt site (by default docs/) and deploys it to GitHub Pages.
#
#   jobs:
#     docs:
#       uses: Hexagon/ombryt/.github/workflows/docs.yml@v0
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#       with:
#         path: docs
#
# See https://ombryt.56k.guru/guide/docs-sites/.
on:
  workflow_call:
    inputs:
      path:
        description: "The directory with ombryt.toml"
        type: string
        default: docs
      output:
        description: "The output directory, relative to path ([build] out)"
        type: string
        default: _site
      version:
        description: "The ombryt version, e.g. 0.1.0, or latest"
        type: string
        default: latest
      strict:
        description: "Fail on broken internal links"
        type: boolean
        default: true
      deploy:
        description: "Deploy to GitHub Pages (false: build and check only)"
        type: boolean
        default: true
      url:
        description: "Build for this URL instead of site.url"
        type: string
        default: ""
    outputs:
      page_url:
        description: "The URL of the deployed site"
        value: ${{ jobs.deploy.outputs.page_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Hexagon/ombryt@v0
        with:
          version: ${{ inputs.version }}
      - name: Build
        env:
          DIR: ${{ inputs.path }}
          STRICT: ${{ inputs.strict }}
          URL: ${{ inputs.url }}
        run: |
          set -- -C "$DIR" build
          [ "$STRICT" = true ] && set -- "$@" --strict
          [ -n "$URL" ] && set -- "$@" --url "$URL"
          ombryt "$@"
      - if: inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.path }}/${{ inputs.output }}

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: The crate packages (what crates.io would get)
        run: cargo package --locked
      - name: The documentation builds, with no broken links
        run: cargo run --release --locked -- -C docs build --strict

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The rust-version in Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked

  action:
    # The setup action (action.yml) against published releases: the latest, and a pinned one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        version: [latest, 0.1.0]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
      - name: The installed binary runs and builds a site
        shell: bash
        env:
          WANTED: ${{ matrix.version }}
          GOT: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GOT"
          if [ "$WANTED" != latest ]; then test "$GOT" = "$WANTED"; fi
          ombryt --version
          ombryt init "$RUNNER_TEMP/site"
          ombryt -C "$RUNNER_TEMP/site" build --strict
